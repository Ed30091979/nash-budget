apply plugin: 'com.android.application'

/*
 * Нужно ли этой сборке разрешение на сеть — решается здесь, и только здесь.
 *
 * Адрес сервера семьи — конфигурация ВЕБ-сборки (`VITE_SYNC_SERVER_URL`, §9), и в APK он приезжает
 * уже внутри страницы: Vite вписывает источник сервера в `connect-src` политики `index.html` и в
 * бандл. Поэтому здесь читается не переменная окружения, а те самые байты, которые будут
 * упакованы. Переменная окружения дала бы второй источник правды и два способа разойтись: сборка
 * с адресом, но без сети (синхронизация молча не работает и выглядит как отказ сервера), и сборка
 * с сетью, но без адреса (лишнее разрешение в карточке магазина, которым никто не пользуется).
 *
 * Отсутствие файла — это состояние до `cap sync`. Оно трактуется как локальная сборка: значение
 * по умолчанию у этого приложения — «никакой сети», и ошибка в сторону меньших прав безопасна.
 *
 * Правило намеренно грубее, чем разбор адреса: «в `connect-src` назван хоть один удалённый
 * источник». Точность здесь не нужна и вредна — разбирать адрес во второй раз значило бы
 * повторить чужое правило и получить право разойтись с ним. `scripts/verify-artifacts.mjs`
 * сверяет получившийся манифест с той же страницей своей, независимой реализацией.
 */
def packagedIndexHtml = providers
    .fileContents(layout.projectDirectory.file('src/main/assets/public/index.html'))
    .asText
    .getOrElse('')
def packagedConnectSrc = packagedIndexHtml =~ /connect-src\s+'self'([^;"]*)/
def syncServerConfigured = packagedConnectSrc.find() && (packagedConnectSrc.group(1) =~ /https?:\/\//).find()

android {
    namespace = "com.edfurman.nashbudget"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.edfurman.nashbudget"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        abortOnError = true
        checkReleaseBuilds = true
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        if (syncServerConfigured) {
            // Штатный способ AGP 8 доложить манифест поверх главного: главный остаётся один и
            // не дублируется, оверлей несёт единственную строку, которой сборка отличается.
            variant.sources.manifests.addStaticManifestFile('src/sync/AndroidManifest.xml')
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
