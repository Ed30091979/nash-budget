    <!--
      script-src 'wasm-unsafe-eval': Argon2id приглашений — это WebAssembly (пакет hash-wasm).
      Ключевое слово разрешает только компиляцию и создание модулей WebAssembly. eval, new Function
      и строковые таймеры остаются запрещёнными: их открывает другое, более широкое ключевое слово,
      которого в этой политике нет и быть не должно.
      Обоснование целиком — в vite.config.ts, рядом с META_CSP; эта строка обязана совпадать с ним.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
