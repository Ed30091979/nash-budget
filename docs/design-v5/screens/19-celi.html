<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Цели</title>
<style>
:root{
  --canvas:#F6F3EE; --surface:#FFFFFF; --sunken:#EEE9E1; --ink:#171410; --muted:#5D574C;
  --border:#E6E0D5; --line:#8D8577; --accent:#C4421A; --on-accent:#FFFFFF; --focus:#0B57D0;
  --amber-soft:#FBF0D5; --amber-ink:#8A5A00; --red-soft:#FBE9E3; --red-ink:#A3341F; --positive:#1F6B48;
  --mint:#DDEFE5; --mint-ink:#1F6B48; --lilac:#ECE6F7; --lilac-ink:#5B3F9E; --peach:#FBE3D3; --peach-ink:#9A4A1C;
  --amber:#F5EBCF; --amber-ink-t:#7A5A00; --sage:#E3EBDD; --sage-ink:#46613A; --coral:#F8E1E4; --coral-ink:#9B2C3F;
  --neutral:#E9E4DA; --neutral-ink:#171410;
  --graphite:#22252A; --on-graphite:#FFFFFF; --on-graphite-muted:#D5D8DE;
  --track:#E4DED3;
  --scrim:rgb(23 20 16 / 45%);
  --shadow-card:0 4px 8px rgb(23 20 16 / 6%), 0 0 1px rgb(23 20 16 / 10%);
  --shadow-sheet:0 -12px 24px rgb(23 20 16 / 10%), 0 0 1px rgb(23 20 16 / 10%);
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", Roboto, "Segoe UI", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--canvas)}
body{width:max-content}
.phone{width:390px;height:844px;position:relative;overflow:hidden;background:var(--canvas);color:var(--ink);
  font-family:var(--font);font-size:15px;line-height:22px;font-weight:400;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
h1,h2,h3,p{margin:0}
.i{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.m,.tv,.amount,.key,.bars,.big,.tnum{font-variant-numeric:tabular-nums}
.pad{padding:0 16px}
.pn{font-variant-numeric:normal}
.cur{font-weight:400;color:var(--muted)}
.on-dark .cur{color:inherit}
.cap{font-size:13px;line-height:18px;color:var(--muted)}
.label{font-size:11px;line-height:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.b{font-weight:700}
.muted{color:var(--muted)}
.pos{color:var(--positive)}
.hy{hyphens:manual;-webkit-hyphens:manual;overflow-wrap:break-word}

/* iOS chrome */
.status{position:absolute;top:0;left:0;right:0;height:47px;display:flex;align-items:center;justify-content:space-between;
  padding:4px 26px 0 36px;font-size:16px;font-weight:700;letter-spacing:-.01em;z-index:30}
.status .sys{display:flex;gap:6px;align-items:center}
.homebar{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);z-index:40}
.scroll{position:absolute;top:47px;left:0;right:0;bottom:106px;overflow:hidden}
.scroll.nonav{bottom:34px}

/* bottom navigation */
.nav{position:absolute;left:0;right:0;bottom:0;height:106px;background:var(--surface);border-top:1px solid var(--border);
  padding:4px 4px 34px;display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;align-items:center;z-index:20}
.tab{height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;line-height:14px;color:var(--muted)}
.tab .dot{width:4px;height:4px;border-radius:2px;background:transparent}
.tab.on{color:var(--ink);font-weight:700}
.tab.on .dot{background:var(--accent)}
.fab{width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;justify-self:center;
  box-shadow:0 6px 14px rgb(196 66 26 / 28%)}

/* title bars */
.tbar{height:52px;display:grid;grid-template-columns:minmax(48px,1fr) auto minmax(48px,1fr);align-items:center;padding:0 4px}
.tbar h1{font-size:17px;line-height:23px;font-weight:700;text-align:center;padding:0 4px}
.tbar .right{justify-self:end;display:flex}
.back{height:48px;display:flex;align-items:center;gap:0;padding:0 8px 0 4px;font-size:17px;justify-self:start}
.ib{width:48px;height:48px;display:grid;place-items:center;border-radius:14px;flex:none}
.ltitle{height:56px;display:flex;align-items:center;justify-content:space-between;padding:4px 4px 0 16px}
.ltitle h1{font-size:28px;line-height:32px;font-weight:700;letter-spacing:-.02em}

/* surfaces */
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow-card)}
.list{background:var(--surface);border-radius:20px;box-shadow:var(--shadow-card);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 8px 8px 16px;position:relative;width:100%}
.row + .row::before{content:"";position:absolute;top:0;left:64px;right:0;height:1px;background:var(--border)}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.row .t{font-weight:700}
.row .chev{color:var(--muted);margin-right:4px}
.plate{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.plate.p40{width:40px;height:40px;border-radius:12px}
.kicker{display:flex;align-items:center;justify-content:space-between;padding:0 4px 0 20px;height:40px}
.section-gap{height:20px}

/* tones */
.t-mint{background:var(--mint);color:var(--mint-ink)} .t-lilac{background:var(--lilac);color:var(--lilac-ink)}
.t-peach{background:var(--peach);color:var(--peach-ink)} .t-amber{background:var(--amber);color:var(--amber-ink-t)}
.t-sage{background:var(--sage);color:var(--sage-ink)} .t-coral{background:var(--coral);color:var(--coral-ink)}
.t-neutral{background:var(--neutral);color:var(--neutral-ink)} .t-graphite{background:var(--graphite);color:var(--on-graphite)}
.t-sunken{background:var(--sunken);color:var(--ink)}

/* buttons */
.btn{min-height:52px;border-radius:14px;font-size:17px;line-height:22px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:0 16px;text-align:center}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-secondary{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn-quiet{color:var(--ink)}
.btn-sm{min-height:48px;font-size:15px;width:auto;padding:0 4px}
.btn-sm>span{height:36px;border-radius:999px;padding:0 14px;display:inline-flex;align-items:center;box-shadow:inset 0 0 0 1px var(--line);background:var(--surface)}

/* chips (48 target, 36 pill) */
.chips{display:flex;flex-wrap:wrap;column-gap:8px}
.chip{min-height:48px;display:inline-flex;align-items:center;flex:none}
.chip>span{min-height:36px;border-radius:999px;padding:7px 14px 7px 12px;display:inline-flex;align-items:center;gap:6px;font-size:15px;line-height:22px;
  background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
.chip.on>span{background:var(--ink);color:#fff;box-shadow:none}
.chip.dash>span{box-shadow:none;outline:1.5px dashed var(--line);outline-offset:-1.5px;background:transparent}

/* segmented */
.seg{display:flex;background:var(--sunken);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border-radius:999px;font-size:15px;color:var(--muted);text-align:center;padding:0 10px;display:flex;align-items:center;justify-content:center}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgb(23 20 16 / 12%), 0 0 1px rgb(23 20 16 / 10%)}

/* sheet */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:50}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:var(--shadow-sheet);z-index:60;display:flex;flex-direction:column}
.grab{width:36px;height:5px;border-radius:3px;background:#CFC8BB;margin:8px auto 0;flex:none}

/* tiles */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 8px;padding:0 16px}
.tile{display:flex;flex-direction:column;align-items:center;text-align:center;min-height:48px;padding:4px 0 6px;border-radius:16px;position:relative}
.sq{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;position:relative;flex:none}
.tile .nm{font-size:12px;line-height:15px;margin-top:6px;min-height:30px;display:flex;align-items:flex-start;justify-content:center;
  hyphens:manual;-webkit-hyphens:manual;max-width:100%;padding:0 2px}
.tile .am{font-size:13px;line-height:17px;font-weight:700;margin-top:2px}
.tile .lim{font-size:11px;line-height:14px;color:var(--muted)}
.tile .bar{width:52px;height:4px;border-radius:2px;background:var(--track);margin-top:5px;overflow:hidden;display:block}
.tile .bar i{display:block;height:100%;background:var(--ink);border-radius:2px}
.tile .bar.amber i{background:var(--amber-ink)} .tile .bar.red i{background:var(--red-ink)}
.badge{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:11px;display:grid;place-items:center;box-shadow:0 0 0 2px var(--canvas)}
.badge.amber{background:var(--amber-soft);color:var(--amber-ink)} .badge.red{background:var(--red-soft);color:var(--red-ink)}
.sq.add{background:transparent;outline:1.5px dashed var(--line);outline-offset:-1.5px;color:var(--muted)}
.hrow{display:flex;gap:8px;padding:0 16px;overflow:hidden}
.hrow .tile{width:76px;flex:none}
.vsep{width:1px;background:var(--border);margin:8px 0 26px;flex:none}

/* fields */
.field{min-height:52px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;padding:0 16px;gap:8px;font-size:17px}
.field .ph{color:var(--muted)}
.flabel{font-size:13px;line-height:18px;color:var(--muted);margin:0 4px 6px}
.search{height:48px;border-radius:14px;background:var(--sunken);display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--muted);font-size:17px}

/* switch */
.switch{width:51px;height:31px;border-radius:16px;background:var(--accent);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:2px;right:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 2px 4px rgb(0 0 0 / 20%)}
.switch.off{background:var(--line)} .switch.off::after{right:auto;left:2px}
@media (max-width:300px){.nav{grid-template-columns:1fr 1fr 64px 1fr 1fr;height:auto;min-height:106px}.tab{height:auto;min-height:56px;padding:4px 0}.tab span:last-child{font-size:10px;line-height:12px;text-align:center;hyphens:manual;-webkit-hyphens:manual}}

.grp{margin:16px 16px 0}
.grp h2{font-size:13px;line-height:18px;font-weight:700;color:var(--muted);margin:0 4px 6px}
.list .row .cap{overflow:hidden;text-overflow:ellipsis}

.il{display:inline-block;vertical-align:-2px;margin-right:3px}
.amt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;padding-right:8px;flex:none}
.amt b{font-weight:700}
.note1{font-size:13px;line-height:18px;color:var(--muted);padding:12px 20px 0}
.overdue{color:var(--red-ink);font-weight:700}
.dplate{position:relative}
.dplate .badge{top:-6px;right:-6px;width:20px;height:20px;border-radius:10px;box-shadow:0 0 0 2px var(--surface)}
.grp h2 .cnt{font-weight:400}

.goal{margin:4px 16px 0;padding:14px 12px 12px 16px}
.ghead{display:flex;align-items:center;gap:12px;width:100%}
.ghead .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.ghead .t{font-size:17px;line-height:22px;font-weight:700}
.ghead .pct{font-size:17px;line-height:22px;font-weight:700;padding-right:4px}
.gbar{display:block;height:8px;border-radius:4px;background:var(--track);margin:14px 4px 0 0;overflow:hidden}
.gbar i{display:block;height:100%;background:var(--ink);border-radius:4px}
.gnums{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:8px 4px 0 0;flex-wrap:wrap}
.gnums b{font-size:17px;line-height:22px}
.gadvice{display:flex;gap:10px;align-items:flex-start;margin:12px 4px 0 0;padding:10px 12px;border-radius:12px;background:var(--amber-soft);color:var(--amber-ink);font-size:13px;line-height:18px}
.gadvice b{font-size:15px;line-height:20px}
.gadvice .i{margin-top:1px}
.gact{display:flex;gap:8px;margin:12px 4px 0 0}
.gact .btn{min-height:48px;font-size:15px}
.done .t{font-weight:700}
.done .ok{color:var(--positive);margin-right:8px}
</style>
</head>
<body>
<div class="phone"><div class="status" aria-hidden="true"><span>9:41</span><span class="sys"><svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="currentColor"/><rect x="10" y="3" width="3" height="9" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg><svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.2 5.6 8.6a3.4 3.4 0 0 1 4.8 0z" fill="currentColor"/><path d="M2.9 5.9a7.4 7.4 0 0 1 10.2 0" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M.6 3.4a10.7 10.7 0 0 1 14.8 0" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg><svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="18" height="9" rx="2" fill="currentColor"/><path d="M25 4.5v4a2 2 0 0 0 0-4z" fill="currentColor" opacity=".45"/></svg></span></div><main class="scroll"><header class="tbar"><button class="back" aria-label="Назад, к разделу «Ещё»"><svg class="i " width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span>Ещё</span></button><h1>Цели</h1><span class="right"><button class="ib" aria-label="Новая цель"><svg class="i " width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button></span></header><section class="card goal"><button class="ghead" aria-label="Отпуск: собрано 45 000 из 150 000 ₽, 30 %. Изменить цель"><span class="plate p40 t-coral"><svg class="i " width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2a1 1 0 0 0-1.1.5l-.3.5a1 1 0 0 0 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3a1 1 0 0 0 1.3.3l.5-.2a1 1 0 0 0 .5-1.2z"/></svg></span><span class="txt"><span class="t">Отпуск</span><span class="cap">на счёте «Резерв платежей»</span></span><span class="pct">30&nbsp;%</span></button><span class="gbar" aria-hidden="true"><i style="width:30%"></i></span><div class="gnums"><span><b><span class="m">45&#8239;000&nbsp;<span class="cur">₽</span></span></b> <span class="cap">из 150&#8239;000&nbsp;₽</span></span><span class="cap">осталось 105&#8239;000&nbsp;₽</span></div><div class="gadvice"><svg class="i " width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:2"><path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h5"/><circle cx="16" cy="16" r="6"/><path d="M16 14v2l1 1"/></svg><span><b>До 1 мая 2027 — по 15&#8239;000&nbsp;₽ в месяц</b><br>В плане 10&#8239;000&nbsp;₽: так соберёте в августе 2027.</span></div><div class="gact"><button class="btn btn-secondary"><svg class="i " width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Пополнить</button></div></section><section class="grp"><h2>Достигнутые</h2><div class="list"><button class="row done"><span class="plate p40 t-coral"><svg class="i " width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/></svg></span><span class="txt"><span class="t">Велосипед</span><span class="cap">собрано 30&#8239;000&nbsp;₽ · в августе</span></span><span class="ok"><svg class="i " width="22" height="22" viewBox="0 0 24 24" role="img" aria-label="Достигнута" style="stroke-width:2"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg></span></button></div></section><p class="note1">Деньги цели лежат на её счёте и входят в «На счетах».</p></main><nav class="nav" aria-label="Разделы"><button class="tab" aria-label="Обзор"><svg class="i " width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="dot"></span><span aria-hidden="true">Об&shy;зор</span></button><button class="tab" aria-label="Операции"><svg class="i " width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg><span class="dot"></span><span aria-hidden="true">Опе&shy;ра&shy;ции</span></button><button class="fab" aria-label="Записать"><svg class="i " width="28" height="28" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:2.25"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button><button class="tab" aria-label="Отчёты"><svg class="i " width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12c.552 0 1.005-.449.95-.998a10 10 0 0 0-8.953-8.951c-.55-.055-.998.398-.998.95v8a1 1 0 0 0 1 1z"/><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/></svg><span class="dot"></span><span aria-hidden="true">От&shy;чё&shy;ты</span></button><button class="tab on" aria-current="page" aria-label="Ещё"><svg class="i " width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg><span class="dot"></span><span aria-hidden="true">Ещё</span></button></nav><div class="homebar" aria-hidden="true"></div></div>
</body>
